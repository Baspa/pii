[[recognizer]]
id = "credential_bearer"
entity_type = "CREDENTIAL"
# RFC 6750's `Authorization: Bearer <b64token>`, matched from the scheme
# name onward.
#
# THE KEYWORD IS INSIDE THE SPAN, AND THAT IS NOT A CHOICE. Rust's regex
# engine has no lookbehind, so there is no way to require `Bearer ` before
# the token without covering it. Covering it is the harmless direction: the
# scheme name is a protocol constant, not caller content, and
# `Authorization: [CREDENTIAL_1]` still tells the caller's model what the
# line was.
#
# CAPITAL `B`, AND A FLOOR OF 24 CHARACTERS. Both exist to keep the English
# noun out. `bearer` is ordinary prose -- "the bearer of this letter", EUR-Lex's
# "bearer securities" -- so the pattern takes RFC 6750's own spelling, which
# is what every HTTP client emits and what no sentence produces mid-clause.
# The floor then covers the sentence-initial case: the token alphabet
# includes `-`, so `Bearer <hyphenated-compound>` is the collision to worry
# about, and 24 unbroken characters is past every English word and every
# ordinary two-word hyphenation. Real opaque tokens start around 32.
#
# The final character class excludes `.`, so a token at the end of a
# sentence does not swallow the full stop -- the one over-mask this shape
# would otherwise produce on every case in its own fixture.
patterns = ['''\bBearer [A-Za-z0-9._~+/-]{23,}[A-Za-z0-9_~+/-]={0,2}''']
validator = "none"
base_confidence = 0.8
checksum_confidence = 0.0
context_confidence = 0.15
negative_context = [
  "placeholder",
  "redacted",
  "your-token",
  "your_token",
  "example token",
  "dummy token",
  "sample token",
]
positive = [
  "Authorization: Bearer 9wKQ2mTvB4nX7cRj0LpZaYdE6sHgUf1oI3Vt",
  "curl -H 'Authorization: Bearer 9wKQ2mTvB4nX7cRj0LpZaYdE6sHgUf1oI3Vt' https://api.example.com",
]
# Twenty-three characters, one short of the floor; the English noun in the
# sentence it actually occurs in; the hyphenated-compound collision the
# floor exists to exclude, kept under it.
negative = [
  "Bearer 9wKQ2mTvB4nX7cRj0LpZaY",
  "the bearer of this letter may collect the parcel",
  "Bearer bonds-and-shares were listed",
]
adversarial = [
  "Bearer securities were withdrawn from circulation in 1998",
  "The bearer of the certificate holds the access key to the archive",
]

# No `bearer` here, deliberately. The word is inside every span this
# recognizer produces and the context window includes the match, so listing
# it would make `context_confidence` fire on every candidate -- a weight
# that can never change an outcome, which is the defect `vat`'s comment
# above records.
[recognizer.context_terms]
en = ["authorization", "access token", "api key", "api_key", "credential", "token"]
nl = ["toegangstoken", "autorisatie"]
de = ["zugriffstoken", "autorisierung"]
fr = ["jeton d'accès", "autorisation"]
es = ["token de acceso", "autorización"]
it = ["token di accesso", "autorizzazione"]

[[recognizer]]
id = "credential_pem_private_key"
entity_type = "CREDENTIAL"
# The armour line is the recognizer. `-----BEGIN RSA PRIVATE KEY-----` is a
# thirty-one-character literal that occurs in exactly one kind of text, and
# the label between `BEGIN ` and `-----` is left open (`[A-Z0-9 ]{0,40}`)
# rather than enumerated: RSA, EC, DSA, OPENSSH, ENCRYPTED and PGP are the
# ones anyone writes down, and a scheme nobody has invented yet still wears
# the same armour. Enumerating would be the stale-pattern failure with a
# longer fuse.
#
# TWO PATTERNS, AND THE SECOND IS THE ONE THAT MATTERS. The first takes a
# closed block, in either of the two forms a key actually travels in: real
# newlines, and the `\n`-escaped single line a key becomes inside a JSON or
# YAML config value. The second takes a block with a `BEGIN` and no `END` --
# a paste that was cut short, a log line that truncated, a ticket where
# someone stopped copying. Without it, the most likely way for a private key
# to arrive here is also the way it goes out unmasked.
#
# Both are line-oriented and lazy, so neither can run away: the first stops
# at the *first* `END` after its `BEGIN`, and the second stops at the first
# line that is not base64. A `.*`-style body would let one stray armour line
# swallow a page of prose.
#
# `PUBLIC KEY` is deliberately not matched. A public key is not a secret,
# and masking one destroys the only thing that makes a TLS or SSH config
# paste diagnosable. It is one word away from this pattern, which is why the
# fixture carries a `PUBLIC KEY` block as a `must_clear` value.
patterns = [
  '''-----BEGIN [A-Z0-9 ]{0,40}PRIVATE KEY(?: BLOCK)?-----(?:[A-Za-z0-9+/=\r\n ]|\\n|\\r)*?-----END [A-Z0-9 ]{0,40}PRIVATE KEY(?: BLOCK)?-----''',
  '''-----BEGIN [A-Z0-9 ]{0,40}PRIVATE KEY(?: BLOCK)?-----(?:\r?\n[A-Za-z0-9+/=]{1,80})*''',
]
validator = "none"
# 0.85 rather than the 0.80 a four-character vendor prefix carries. The
# difference is not decoration: `score` reaches the caller on every returned
# entity (`pii_detection_api::wire::Entity`), and a caller that applies its own
# floor to it -- Temperate's `PII_SCORE_THRESHOLD` does -- sees it. A
# thirty-one-character armour line is stronger evidence than a
# four-character prefix, and reporting the same number for both would be
# the dishonest choice. The ladder's rungs are unchanged: 0.85 decides
# alone, 0.60 under a placeholder label does not, and 0.95 with the
# credential's own label decides again.
base_confidence = 0.85
checksum_confidence = 0.0
context_confidence = 0.1
negative_context = [
  "placeholder",
  "redacted",
  "your-private-key",
  "your_private_key",
  "example key",
  "dummy key",
  "sample key",
]
positive = [
  """-----BEGIN RSA PRIVATE KEY-----
MIIBOgIBAAJBAKj34GkxFhD90vcNLYLInFEX6Ppy1tPf9Cnzj4p4WGeKLs1Pt8Qu
KUpRKfFLfRYC9AIKjbJTWit+CqvjWYzvQwECAwEAAQ==
-----END RSA PRIVATE KEY-----""",
  """-----BEGIN OPENSSH PRIVATE KEY-----
b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtz
-----END OPENSSH PRIVATE KEY-----""",
  "-----BEGIN EC PRIVATE KEY-----\\nMHcCAQEEIBGpMlZ8kAcm+qFBoZfLPPFRPGxfCQmZQK2P0FfDN5W1oAoGCCqGSM49\\n-----END EC PRIVATE KEY-----",
]
# A public key, which is not a secret; a certificate *request*, which
# carries a public key and a subject and no secret; two armour lines one
# word short of being one.
#
# No certificate block here, deliberately, even though it is the obvious
# neighbour: `negative_fixtures_are_not_found` asks that no recognizer
# raise the *entity type*, and `credential_pem_certificate` below raises
# `CREDENTIAL` on one by design. The separation between the two lives in
# their patterns and in that recognizer's own comment.
negative = [
  """-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEqxL9pQvXbJ0m3sCUcH8kOtQq4Rrs
-----END PUBLIC KEY-----""",
  """-----BEGIN CERTIFICATE REQUEST-----
MIIBkTCB+wIJAKj34GkxFhD9MA0GCSqGSIb3DQEBCwUAMBQxEjAQBgNVBAMMCWxv
-----END CERTIFICATE REQUEST-----""",
  "-----BEGIN PRIVATE-----",
  "-----BEGIN RSA PRIVATE KEY",
]
adversarial = [
  "the section is separated by ----- in the plain-text export",
  "see chapter 4 ----- Cryptography ----- for the derivation",
]

