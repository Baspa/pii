[[recognizer]]
id = "credential_slack_token"
entity_type = "CREDENTIAL"
# The research changed this pattern, and the change is the difference
# between a recognizer and a liability. The scanning pattern in common
# circulation is `xox[baprs]-[0-9a-zA-Z]{10,48}`, which matches
# `xoxo-love-you-always` and any other hyphenated word run beginning `xox`.
# Slack's actual tokens are segmented: the kind, then one to three numeric
# segments, then the secret. Requiring the numeric segments costs nothing in
# recall and removes the entire class of prose collision.
#
# `xapp-` app-level tokens are their own shape -- a single digit, an
# upper-case app id, a numeric issue time, and a 64-character hex signature
# -- and are matched by the second pattern.
