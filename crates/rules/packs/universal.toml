[[recognizer]]
id = "credential_google_api_key"
entity_type = "CREDENTIAL"
# `AIza` plus 35 characters of base64url, 39 in total -- the one length
# every published description of the format agrees on.
#
# NO TRAILING BOUNDARY, AND THE REASON MATTERS. The alphabet includes `-`,
# which is not a word character, so `\b` after a key whose last character is
# a hyphen would not hold and roughly one key in sixty-four would go
# unmasked. Rust's regex engine has no lookahead, so "not followed by
# another key character" cannot be expressed without consuming the character
# and moving the span. The remaining exposure is a *longer* base64url run
# beginning `AIza` at a word boundary, whose first 39 characters would be
# masked -- and the leading `\b` is what makes that all but unreachable
# inside a base64 blob, where every character is a word character and there
# are no boundaries to start at. `tests/credentials.rs` pins the base64
# fragment case.
patterns = ['''\bAIza[0-9A-Za-z_-]{35}''']
validator = "none"
base_confidence = 0.8
checksum_confidence = 0.0
context_confidence = 0.15
negative_context = [
  "placeholder",
  "redacted",
  "your-api-key",
  "your_api_key",
  "example key",
  "example token",
  "dummy key",
  "sample key",
]
