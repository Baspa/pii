[[recognizer]]
id = "credential_pem_certificate"
entity_type = "CREDENTIAL"
# A certificate is the one *public* artefact in this family, and it is here
# by decision rather than by the logic the rest of the file follows.
#
# THE ARGUMENT AGAINST is real and is recorded here so nobody has to
# reconstruct it: a certificate is meant to be handed to strangers, masking
# one prevents no leak, and a TLS config paste with its certificate removed
# is harder to diagnose than one with it. THE ARGUMENT FOR, which the human
# partner who scoped this decided on: a certificate block travels with the
# key it belongs to and in the same paste, the block is bulk base64 rather
# than prose so masking it destroys no sentence, and a firewall that masks
# `BEGIN PRIVATE KEY` and leaves `BEGIN CERTIFICATE` invites the reader to
# conclude the second is safe to paste anywhere.
#
# Kept as its own recognizer rather than a third pattern on the private-key
# one precisely because the arguments differ: this is the one that should be
# straightforward to remove if the trade is ever re-decided, and removing it
# must not disturb the keys.
patterns = [
  '''-----BEGIN CERTIFICATE-----(?:[A-Za-z0-9+/=\r\n ]|\\n|\\r)*?-----END CERTIFICATE-----''',
  '''-----BEGIN CERTIFICATE-----(?:\r?\n[A-Za-z0-9+/=]{1,80})*''',
]
validator = "none"
base_confidence = 0.85
checksum_confidence = 0.0
context_confidence = 0.1
negative_context = [
  "placeholder",
  "redacted",
  "example certificate",
  "dummy certificate",
  "sample certificate",
]
positive = [
  """-----BEGIN CERTIFICATE-----
MIIBkTCB+wIJAKj34GkxFhD9MA0GCSqGSIb3DQEBCwUAMBQxEjAQBgNVBAMMCWxv
Y2FsaG9zdDAeFw0yNjA4MjgwMDAwMDBaFw0yNzA4MjgwMDAwMDBa
-----END CERTIFICATE-----""",
  "-----BEGIN CERTIFICATE-----\\nMIIBkTCB+wIJAKj34GkxFhD9MA0GCSqGSIb3DQEBCwUAMBQxEjAQBgNVBAMMCWxv\\n-----END CERTIFICATE-----",
]
# A certificate *request*, which carries a public key and a subject and no
# secret; a public key; an armour line missing its closing dashes. No
# private-key block here, for the reason
# `credential_pem_private_key`'s own negative list gives.
