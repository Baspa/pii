[[recognizer]]
id = "credential_jwt"
entity_type = "CREDENTIAL"
# Three base64url segments separated by dots, with the first anchored on
# `eyJ`.
#
# THE ANCHOR IS THE WHOLE RECOGNIZER. "Three base64 runs and two dots" is
# what the shape looks like and it is not a pattern worth having: it matches
# `bundle.min.js.map`, a Maven coordinate, a dotted object path, and any
# three-part identifier a log line invents. A JOSE header is a JSON object,
# every library emits it with no leading space, and base64url of `{"` is
# `eyJ` -- so anchoring there costs nothing real and turns an open shape
# into a closed one. A header written `{ "alg" ... }` would encode as `eyAi`
# and go unmatched; no JOSE library emits that, and widening to cover it
# would give back exactly the collisions the anchor removes.
#
# Segment floors of 10/10/20 rather than exact lengths: header and payload
# lengths vary with the claim set, and the signature is 43 characters for
# HS256 and 342 for RS256. The floor on the third segment is what excludes
# an unsigned (`alg: none`) token, whose third segment is empty -- that is a
# token with no secret in it, and masking it would be masking a claim set
# and calling it a credential.
#
# No trailing boundary: the alphabet includes `-`, and the quantifiers are
# greedy and open-ended, so the match takes the whole token rather than a
# prefix of it. See `credential_google_api_key` above for the same
# reasoning where the length is fixed and the trade is different.
#
# THE PAYLOAD IS NOT DECODED. A JWT's claim set routinely carries `sub`,
# `email` and `name`, and the decision is to mask the whole token and report
# nothing about its contents. Three reasons, in order of weight: decoding
# means base64-decoding and JSON-parsing attacker-controlled bytes in a
# service whose contract is that it never emits what it sees; the whole
# token is the secret regardless of its contents, and masking it already
# removes every claim inside it; and `/analyze`'s `Entity` is
# `{type, country, start, end, score}` -- offsets into the *original* text
# -- so a decoded claim has no span to return, and reporting one would mean
# handing the caller back, in plaintext, the personal data the mask just
# removed. See `training/reports/credentials.md`.
patterns = ['''\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}''']
validator = "none"
# 0.80, the same as a documented vendor prefix, and for the same reason: a
# JWT pasted bare into a log has no label beside it, and requiring one would
# leak the population this type exists for.
base_confidence = 0.8
checksum_confidence = 0.0
context_confidence = 0.15
negative_context = [
  "placeholder",
  "redacted",
  "your-token",
  "your_token",
  "example token",
  "dummy token",
  "sample token",
]
positive = [
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkphbmUifQ.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXkw",
  "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkphbmUifQ.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXkw",
]
# A header that is not a JSON object; two segments, not three; an unsigned
# token, whose empty third segment carries no secret.
negative = [
  "Zm9vYmFyYmF6cXV4.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0",
  "eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiIxMjM0NTY3ODkwIn0.",
]
adversarial = [
  "the build emitted bundle.min.js.map alongside the sources",
  "resolve org.example.tooling.core from the local repository",
]

