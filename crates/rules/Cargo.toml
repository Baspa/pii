[package]
name = "pii-detection-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
pii-detection-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
regex = "1"
aho-corasick = "1"
phonenumber = "0.3"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = { version = "1" }
pii-detection-resolve = { path = "../resolve" }
